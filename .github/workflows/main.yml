name: 'Update schedule'

on:
  schedule:
    - cron: '0 22 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch:
    branches:
      - master
jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          ref: master

      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: 'pipenv'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install pipenv
        run: pip3 install --user pipenv

      - name: Install dependencies
        run: |
          pipenv --python 3.13
          pipenv install

      - name: Generate user_demo.txt (auto scan + classify)
        run: python scripts/generate_demo.py


      - name: Run update
        run: pipenv run dev

      - name: Commit result to this repo
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f output/user_result.txt output/user_result.m3u config/user_demo.txt 2>/dev/null || true
          if [ -f "output/cache.pkl" ]; then git add -f "output/cache.pkl"; fi
          if ! git diff --staged --quiet; then
            git commit -m "auto update $(date +%F)"
            git push origin master
          else
            echo "No changes to commit"
          fi
