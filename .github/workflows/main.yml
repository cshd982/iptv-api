name: 'Update schedule'

on:
  schedule:
    - cron: '0 22 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch:
    branches:
      - master

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          ref: master

      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: 'pipenv'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install pipenv
        run: pip3 install --user pipenv

      - name: Install dependencies
        run: |
          pipenv --python 3.13
          pipenv install

      - name: Run update
        run: pipenv run dev

      - name: Commit result to this repo
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f output/user_result.txt output/user_result.m3u 2>/dev/null || true
          if [ -f "output/cache.pkl" ]; then git add -f "output/cache.pkl"; fi
          if ! git diff --staged --quiet; then
            git commit -m "auto update $(date +%F)"
            git push origin master
          else
            echo "No changes to commit"
          fi

      - name: Push live files to Gitee tvbox repo
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -e
          if [ ! -f "output/user_result.txt" ] && [ ! -f "output/user_result.m3u" ]; then
            echo "No result files, skip Gitee push"
            exit 0
          fi
          git clone --depth 1 https://oauth2:${GITEE_TOKEN}@gitee.com/cshd982/tvbox.git /tmp/tvbox
          cd /tmp/tvbox
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          [ -f "$GITHUB_WORKSPACE/output/user_result.txt" ] && cp "$GITHUB_WORKSPACE/output/user_result.txt" ./live.txt
          [ -f "$GITHUB_WORKSPACE/output/user_result.m3u" ] && cp "$GITHUB_WORKSPACE/output/user_result.m3u" ./live.m3u
          git add -f live.txt live.m3u
          if ! git diff --staged --quiet; then
            git commit -m "auto update $(date +%F)"
            git push origin master
            echo "Pushed live.txt and live.m3u to gitee.com/cshd982/tvbox"
          else
            echo "No content change, skip Gitee push"
          fi
